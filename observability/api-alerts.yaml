apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: observability
  labels:
    release: monitoring
spec:
  groups:
  - name: api.rules
    rules:

    - alert: ApiDown
      expr: up{job="api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "API is down"
        description: "API pod is not responding for more than 1 minute"

    - alert: ApiHighLatency
      expr: |
        histogram_quantile(
          0.95,
          sum(rate(http_request_latency_seconds_bucket[5m])) by (le)
        ) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High API latency"
        description: "P95 latency is above 1s for 2 minutes"